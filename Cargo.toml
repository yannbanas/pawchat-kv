[package]
name = "pawchat-kv"
version = "0.1.0"
edition = "2021"
description = "Embedded rate-limiter and credential-version revocation cache for PawChat. Not a general-purpose KV store."
license = "MIT"
publish = false

[lib]
name = "pawchat_kv"
path = "src/lib.rs"

[dependencies]
dashmap = "6"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "time", "macros"] }
redb = "2"
serde = { version = "1", features = ["derive"] }
bincode = "1"
tracing = "0.1"

[dev-dependencies]
criterion = { version = "0.5", features = ["async_tokio"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "time", "macros", "test-util"] }
tempfile = "3"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[[bench]]
name = "rate_limiter_bench"
harness = false
